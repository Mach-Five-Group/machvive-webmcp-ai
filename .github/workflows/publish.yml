name: Publish to npm

# Publishing is triggered by pushing a release tag, matching how releases are
# already cut locally: npm version <x> && git tag -a v<x> && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights.
      # Without this, trusted publishing fails and no token can substitute.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          # npm recommends disabling the dependency cache for release builds.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+; the runner's bundled npm may be
      # older than that even on current Node.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # A tag that disagrees with the manifest publishes the wrong version under
      # the right name, which cannot be undone. Cheaper to fail here.
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::Tag v$TAG does not match package.json $PKG"; exit 1; }

      - run: npm test

      # No NODE_AUTH_TOKEN: trusted publishing authenticates over OIDC.
      # --provenance is passed explicitly rather than relying on trusted
      # publishing's automatic attestation, which has been reported not to fire
      # in every case. It is a no-op when the attestation is already generated.
      - run: npm publish --access public --provenance
